name: Coletar Ofertas Diárias

on:
  schedule:
    - cron: '0 9 * * *' # Roda às 06:00 no horário de Brasília
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Baixar o código do repositório
        uses: actions/checkout@v3

      - name: 2. Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. Instalar as dependências
        run: pip install -r requirements.txt

      - name: 4. Executar o script de coleta
        env:
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          MERCADO_LIVRE_AFFILIATE_ID: ${{ secrets.MERCADO_LIVRE_AFFILIATE_ID }}
        run: python scripts/coletar_ofertas.py

      - name: 5. Salvar o arquivo de ofertas atualizado
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ofertas.json
          git commit -m "🤖 Atualização automática das ofertas (API ML)" || echo "Nenhuma alteração nas ofertas hoje"
          git push
