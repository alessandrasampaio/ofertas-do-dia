name: Coletar Ofertas Diárias

on:
  schedule:
    # O cron roda no fuso horário UTC. '0 9 * * *' significa 09:00 UTC, que é 06:00 no horário de Brasília.
    - cron: '0 9 * * *'
  workflow_dispatch: # Isso permite que você clique em um botão para rodar manualmente e testar

# Permissão necessária para que o robô possa salvar o arquivo JSON atualizado no repositório
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Baixar o código do repositório
        uses: actions/checkout@v3

      - name: 2. Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. Instalar as dependências (requests, beautifulsoup4, etc)
        run: pip install -r requirements.txt

      - name: 4. Executar o script de coleta
        # Aqui nós passamos as chaves secretas de forma segura para o script
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/coletar_ofertas.py

      - name: 5. Salvar o arquivo de ofertas atualizado no repositório
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ofertas.json
          git commit -m "🤖 Atualização automática das ofertas" || echo "Nenhuma alteração nas ofertas hoje"
          git push
